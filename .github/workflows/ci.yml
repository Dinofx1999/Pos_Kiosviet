name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: erp, POSTGRES_PASSWORD: erp, POSTGRES_DB: retail_erp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/retail_erp_test?schema=public
      DATABASE_URL_TEST: postgresql://erp:erp@localhost:5432/retail_erp_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-123456
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @erp/shared build
      - run: pnpm --filter @erp/api prisma:generate
      - run: pnpm --filter @erp/api typecheck
      - run: pnpm --filter @erp/web typecheck
      - run: pnpm lint
      - run: pnpm --filter @erp/api test:unit
      - run: pnpm --filter @erp/api test:int -- --forceExit
      - run: pnpm build
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
