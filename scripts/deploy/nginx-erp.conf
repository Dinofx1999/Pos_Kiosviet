# Retail ERP – nginx: web tĩnh + proxy API/uploads về Node (127.0.0.1:3000)
# Thêm domain: đổi server_name, rồi `certbot --nginx -d ten-mien.vn` để bật HTTPS.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root __WEB_ROOT__;
  index index.html;
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # API
  location /api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;   # nhập KiotViet / xuất Excel có thể lâu
    proxy_send_timeout 600s;
  }

  # ảnh sản phẩm do API phục vụ
  location /uploads/ {
    proxy_pass http://127.0.0.1:3000/uploads/;
    proxy_set_header Host $host;
    expires 7d;
  }

  # tệp build của web: cache lâu (tên tệp có hash)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ảnh hướng dẫn sử dụng
  location /guide/ {
    expires 7d;
    try_files $uri =404;
  }

  # SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
